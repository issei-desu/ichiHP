<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RasPi Connect - 固定ポータル</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --sub: #94a3b8;
      --primary: #3b82f6;
      --accent: #8b5cf6;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 { font-size: 1.3rem; margin-bottom: 6px; }
    .status {
      font-size: 0.9rem;
      color: var(--sub);
      margin-bottom: 20px;
      min-height: 1.4em;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #0f172a; color: var(--text); border: 1px solid var(--border); }
    .meta {
      font-size: 0.76rem;
      color: var(--sub);
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🍓</div>
    <h1>RasPi Connect</h1>
    <div class="status" id="statusText">最新のラズパイHTTPS URLを取得して接続中...</div>
    <div class="spinner" id="spinner"></div>

    <div id="linksArea" style="display:none;">
      <a id="httpsBtn" class="btn btn-primary" href="#">🔒 外出先・HTTPS公開URLで開く</a>
      <a id="tailscaleBtn" class="btn btn-secondary" href="http://100.109.32.37:8090">🌐 Tailscaleで開く (100.109.32.37)</a>
      <a id="localBtn" class="btn btn-secondary" href="http://192.168.0.21:8090">🏠 自宅Wi-Fiで開く (192.168.0.21)</a>
    </div>

    <button id="cancelBtn" class="btn btn-secondary" style="margin-top:6px; font-size:0.82rem; padding:9px;" onclick="stayOnPage()">
      自動転送を止めて接続先一覧を見る
    </button>

    <div class="meta" id="updatedAt"></div>
  </div>

  <script>
    const KVDB_URL = "https://kvdb.io/C73anz47CwZ5a14fmn1Rba/raspi_connect_url";
    const params = new URLSearchParams(window.location.search);
    let autoRedirect = !params.has("stay");

    function stayOnPage() {
      autoRedirect = false;
      document.getElementById("spinner").style.display = "none";
      document.getElementById("cancelBtn").style.display = "none";
      document.getElementById("statusText").textContent = "接続方法を選択してください";
      document.getElementById("linksArea").style.display = "block";
    }

    async function fetchLatestInfo() {
      // 1. Try real-time KVDB first
      try {
        const res = await fetch(KVDB_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          return await res.json();
        }
      } catch (e) {}

      // 2. Fallback to url.json in GitHub Pages repo
      try {
        const res2 = await fetch("./url.json?t=" + Date.now(), { cache: "no-store" });
        if (res2.ok) {
          return await res2.json();
        }
      } catch (e) {}
      return null;
    }

    async function init() {
      if (!autoRedirect) {
        stayOnPage();
      }
      const data = await fetchLatestInfo();
      if (!data || !data.tunnel_url) {
        stayOnPage();
        document.getElementById("statusText").textContent = "トンネルURLが見つかりません。Tailscaleまたは自宅Wi-Fiからお試しください。";
        return;
      }

      document.getElementById("httpsBtn").href = data.tunnel_url;
      if (data.tailscale_url) document.getElementById("tailscaleBtn").href = data.tailscale_url;
      if (data.local_url) document.getElementById("localBtn").href = data.local_url;
      if (data.updated_at) {
        document.getElementById("updatedAt").textContent = "最終トンネル更新: " + data.updated_at;
      }
      document.getElementById("linksArea").style.display = "block";

      if (autoRedirect) {
        document.getElementById("statusText").textContent = "ラズパイへ移動しています...";
        setTimeout(() => {
          if (autoRedirect) {
            window.location.replace(data.tunnel_url);
          }
        }, 350);
      }
    }

    init();
  </script>
</body>
</html>
